{% if page.comments != false %}
<div class="giscus-container">
  <div class="giscus"></div>
  <script>
    // giscus takes two to four seconds to show comments, most of it waiting on
    // GitHub, so start three screens ahead rather than at the browser's
    // lazy-iframe distance and readers arrive to them.
    (function () {
      var attrs = {
        'data-repo': {{ site.repo | jsonify }},
        'data-repo-id': 'MDEwOlJlcG9zaXRvcnkzMDE4NDU1NQ==',
        'data-category': 'General',
        'data-category-id': 'DIC_kwDOAcyUa84CSbZ-',
        'data-mapping': 'specific',
        'data-term': {{ page.path | split: '/' | last | replace: '.md', '' | jsonify }},
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'bottom',
        'data-lang': '{% assign current_lang = page.lang | default: site.lang %}{% if current_lang == 'en-US' or current_lang == 'en' %}en{% else %}zh-CN{% endif %}',
        'data-theme': 'https://weekly.tw93.fun/styles/giscus-blog.css'
      };
      var load = function () {
        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.async = true;
        script.crossOrigin = 'anonymous';
        Object.keys(attrs).forEach(function (key) { script.setAttribute(key, attrs[key]); });
        document.querySelector('.giscus-container').appendChild(script);
      };
      var target = document.querySelector('.giscus');
      if (!('IntersectionObserver' in window)) return load();
      var observer = new IntersectionObserver(function (entries) {
        if (!entries.some(function (entry) { return entry.isIntersecting; })) return;
        observer.disconnect();
        load();
      }, { rootMargin: '0px 0px 300% 0px' });
      observer.observe(target);
    })();
  </script>
</div>
{% endif %}
