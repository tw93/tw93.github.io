{% if site.newsletter == true %}
{% if page.lang == 'en-US' %}{% assign nl_lang = 'en' %}{% else %}{% assign nl_lang = 'zh' %}{% endif %}
<form id="newsletter" class="newsletter" hidden data-lang="{{ nl_lang }}"
  {% if nl_lang == 'en' %}
  data-sent="Check your inbox and click the link to confirm."
  data-invalid="That email address doesn't look right."
  data-failed="Couldn't send it right now, try again later."
  {% else %}
  data-sent="确认信已发到邮箱，点里面的链接就订阅好了。"
  data-invalid="邮箱地址的格式不对。"
  data-failed="暂时没能发出，过一会儿再试试。"
  {% endif %}>
  <p class="newsletter-note">{% if nl_lang == 'en' %}New posts land in your inbox.{% else %}新文章发布后发到你的邮箱{% endif %}</p>
  <div class="newsletter-row">
    <input type="email" name="email" required autocomplete="email" maxlength="254"
      placeholder="{% if nl_lang == 'en' %}Email address{% else %}邮箱地址{% endif %}"
      aria-label="{% if nl_lang == 'en' %}Email address{% else %}邮箱地址{% endif %}">
    <button type="submit">{% if nl_lang == 'en' %}Subscribe{% else %}订阅{% endif %}</button>
  </div>
  <input class="newsletter-trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="newsletter-status" role="status" aria-live="polite"></p>
</form>
<script>
  // The 邮件订阅 button beside 支持作者 opens the form under the pair. The
  // panel grows from nothing and fades in over 0.25s, and shrinks back the same
  // way; reduced motion just shows or hides it.
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  document.querySelectorAll('.newsletter-toggle').forEach(function (toggle) {
    var form = document.getElementById(toggle.getAttribute('aria-controls'));
    if (!form) return;
    var running;
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(open));
      if (running) running.cancel();
      form.hidden = false;
      if (open) form.querySelector('input[type="email"]').focus({ preventScroll: true });
      if (reduceMotion.matches || !form.animate) {
        form.hidden = !open;
        return;
      }
      var style = getComputedStyle(form);
      var shown = {
        height: form.offsetHeight + 'px',
        paddingTop: style.paddingTop,
        paddingBottom: style.paddingBottom,
        marginTop: style.marginTop,
        marginBottom: style.marginBottom,
        opacity: 1
      };
      var folded = { height: '0px', paddingTop: '0px', paddingBottom: '0px', marginTop: '0px', marginBottom: '0px', opacity: 0 };
      form.style.overflow = 'hidden';
      running = form.animate(open ? [folded, shown] : [shown, folded], { duration: 250, easing: 'ease-out' });
      running.onfinish = function () {
        form.style.overflow = '';
        form.hidden = !open;
      };
    });
  });

  // Posts to the Weekly's signup function, which serves both sites; it only
  // mails a confirmation link.
  document.querySelectorAll('form.newsletter').forEach(function (form) {
    var status = form.querySelector('.newsletter-status');
    var button = form.querySelector('button');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var data = new FormData(form);
      button.disabled = true;
      fetch('https://weekly.tw93.fun/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: data.get('email'),
          website: data.get('website'),
          lang: form.dataset.lang,
          topics: ['blog']
        })
      }).then(function (response) {
        if (response.ok) {
          form.reset();
          return form.dataset.sent;
        }
        return response.status === 400 ? form.dataset.invalid : form.dataset.failed;
      }).catch(function () {
        return form.dataset.failed;
      }).then(function (message) {
        status.textContent = message;
        button.disabled = false;
      });
    });
  });
</script>
{% endif %}
