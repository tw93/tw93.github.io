{{ page.notes_sprite }}

<div class="notes notes-single">
  <h1 class="visually-hidden">{{ page.title | escape }}</h1>
  <div class="notes-list" id="J_notes">{{ page.note_html }}</div>
  <nav class="notes-pager">
    <a href="{{ '/notes/' | relative_url }}">全部 Notes</a>
    <a href="{{ page.note_month.url }}">{{ page.note_month.label }}</a>
  </nav>
</div>
<script type="application/ld+json">{{ page.note_jsonld }}</script>
<script src="{{ '/js/notes.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
