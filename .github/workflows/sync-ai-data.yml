name: Sync AI Knowledge Data from Yobi

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Yobi
        # Fail loudly on a bad fetch. Silently keeping the previous file makes
        # the site publish stale AI data that looks fresh.
        run: |
          set -euo pipefail
          mkdir -p api projects
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/llms-full.txt -o llms-full.txt
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/profile -o api/profile.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/projects -o api/projects.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/blog -o api/blog.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/weekly -o api/weekly.json
          for slug in pake kaku miaoyan mole mole-mac waza kami; do
            curl -sf --retry 3 --retry-delay 5 "https://yobi.tw93.fun/projects/${slug}" -o "projects/${slug}.md"
          done

      - name: Rewrite legacy CDN to R2
        run: |
          for f in llms-full.txt api/profile.json api/projects.json api/blog.json api/weekly.json projects/*.md; do
            [ -f "$f" ] || continue
            perl -i -pe '
              s{cdn\.fliggy\.com/uPic/}{cdn.tw93.fun/blog/upic/}g;
              s{cdn\.fliggy\.com/upic/}{cdn.tw93.fun/blog/upic/}g;
              s{cdn\.fliggy\.com/pic/}{cdn.tw93.fun/blog/pic/}g;
              s{(cdn\.tw93\.fun/blog/[^\s"?\\]+)\?x-oss-process=[^"\\ ]*}{$1}g;
            ' "$f"
          done

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt api/ projects/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync AI knowledge data from Yobi"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The AI surfaces are the only pages that change on this schedule, and the
      # workflow that used to carry IndexNow (jekyll.yml) triggers on `master`
      # and never runs, so nothing has been pinging search engines for them.
      - name: Ping IndexNow with the refreshed AI surfaces
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          KEY="6ff2b87724ac930114bf05c74db50bb5"
          HOST="tw93.fun"

          URLS=$(git diff --name-only HEAD~1 HEAD -- 'projects/*.md' 'llms-full.txt' \
            | sed "s|^|https://$HOST/|")

          if [ -z "$URLS" ]; then
            echo "No AI surface URLs changed, skipping IndexNow"
            exit 0
          fi

          URL_LIST=$(printf '%s\n' "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          echo "Submitting to IndexNow: $URL_LIST"

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URL_LIST}"
