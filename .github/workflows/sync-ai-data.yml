name: Sync AI Knowledge Data from Yobi

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Yobi
        # Fail loudly on a bad fetch. Silently keeping the previous file makes
        # the site publish stale AI data that looks fresh.
        run: |
          set -euo pipefail
          mkdir -p api projects
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/llms-full.txt -o llms-full.txt
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/profile -o api/profile.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/projects -o api/projects.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/blog -o api/blog.json
          curl -sf --retry 3 --retry-delay 5 https://yobi.tw93.fun/api/weekly -o api/weekly.json
          # This list used to be hardcoded. Yobi's llms.txt links every core
          # project to tw93.fun/projects/{slug}.md, so adding a project there
          # while this list stayed put would publish a link to a file this job
          # never fetches. Read the list from the payload already downloaded.
          slugs=$(jq -r '.projects[] | select(.tier == "core") | .slug' api/projects.json)
          if [ -z "$slugs" ]; then
            echo "No core slugs in api/projects.json, refusing to sync a partial set."
            exit 1
          fi
          echo "Core projects: $(echo "$slugs" | tr '\n' ' ')"
          for slug in $slugs; do
            curl -sf --retry 3 --retry-delay 5 "https://yobi.tw93.fun/projects/${slug}" -o "projects/${slug}.md"
          done

      - name: Rewrite legacy CDN to R2
        run: |
          for f in llms-full.txt api/profile.json api/projects.json api/blog.json api/weekly.json projects/*.md; do
            [ -f "$f" ] || continue
            perl -i -pe '
              s{cdn\.fliggy\.com/uPic/}{cdn.tw93.fun/blog/upic/}g;
              s{cdn\.fliggy\.com/upic/}{cdn.tw93.fun/blog/upic/}g;
              s{cdn\.fliggy\.com/pic/}{cdn.tw93.fun/blog/pic/}g;
              s{(cdn\.tw93\.fun/blog/[^\s"?\\]+)\?x-oss-process=[^"\\ ]*}{$1}g;
            ' "$f"
          done

      - name: Refresh the counts in the hand-written llms.txt
        # llms.txt stays hand-written: its "when to use this site" section is
        # better than anything generated. Only the two numbers that rot are
        # touched, and they had already drifted to 152K stars across 20
        # projects while Yobi was serving 156K across 19.
        run: |
          set -euo pipefail
          stars=$(jq -r '.totalStars' api/profile.json)
          count=$(jq -r '.projectCount' api/profile.json)
          if [ "$stars" = "null" ] || [ "$count" = "null" ] || [ "$stars" -lt 1000 ]; then
            echo "Refusing to write implausible counts: stars=$stars count=$count"
            exit 1
          fi
          label="$((stars / 1000))K+"
          perl -i -pe "s/\d+K\+ GitHub stars across \d+ projects/${label} GitHub stars across ${count} projects/" llms.txt
          grep -n "GitHub stars across" llms.txt

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt llms.txt api/ projects/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync AI knowledge data from Yobi"
            # A plain push loses the whole run to any commit that lands between
            # checkout and push: a hand edit, or the daily cron overlapping one.
            # The generated files are wholly rewritten from Yobi each run, so
            # rebasing onto whatever arrived is safe.
            pushed=false
            for attempt in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected, rebasing onto origin/main (attempt $attempt)"
              git pull --rebase --autostash origin main
            done
            if [ "$pushed" != true ]; then
              echo "Could not push after 3 attempts"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The AI surfaces are the only pages that change on this schedule, and the
      # workflow that used to carry IndexNow (jekyll.yml) triggers on `master`
      # and never runs, so nothing has been pinging search engines for them.
      - name: Ping IndexNow with the refreshed AI surfaces
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          KEY="6ff2b87724ac930114bf05c74db50bb5"
          HOST="tw93.fun"

          URLS=$(git diff --name-only HEAD~1 HEAD -- 'projects/*.md' 'llms-full.txt' \
            | sed "s|^|https://$HOST/|")

          if [ -z "$URLS" ]; then
            echo "No AI surface URLs changed, skipping IndexNow"
            exit 0
          fi

          URL_LIST=$(printf '%s\n' "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          echo "Submitting to IndexNow: $URL_LIST"

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URL_LIST}"
